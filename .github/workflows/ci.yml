name: CI

# Pull requests and pushes to main: build, unit tests (Windows and Linux), the end-to-end and diagnostics scenarios, the
# installer test and the UI smoke test, and on Windows on Arm the unit tests, then the x64 build's self-test, headless
# checks and the same scenarios under emulation. The soak and overhead checks run on demand (workflow_dispatch) and on a
# release tag, where they are required. A tag v* also signs the build and the installer, verifies every signature and
# publishes the release.
#
# Fork pull requests are safe: this runs on pull_request (never pull_request_target), no job a pull request can reach
# holds a secret or a write token, and the signing secrets live in the "release" environment, which only a v* tag can use.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # GitHub sets CI=true, which turns on the locked NuGet restore (Directory.Build.props): packages.lock.json must match.

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/PoolWatch.Tests -c Release --logger "console;verbosity=normal"
      - name: App-layer unit tests (Windows only)
        run: dotnet test tests/PoolWatch.AppTests -c Release --logger "console;verbosity=normal"
      # Each build is laid out as it is installed: PoolWatch itself is app\PoolWatch.exe, with the files it loads from its
      # own folder; the launcher (the next step) is PoolWatch.exe above it.
      - name: Publish framework-dependent single file
        run: dotnet publish src/PoolWatch/PoolWatch.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -o publish/fd/app
      - name: Publish self-contained single file
        shell: pwsh
        run: |
          dotnet publish src/PoolWatch/PoolWatch.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/sc/app
          if ($LASTEXITCODE -ne 0) { throw "self-contained publish failed ($LASTEXITCODE)" }
          Get-ChildItem publish/fd/app, publish/sc/app | Format-Table Name, Length
          $fd = (Get-Item publish/fd/app/PoolWatch.exe).Length
          if ($fd -gt 30MB) { throw "framework-dependent exe is $fd bytes: the runtime was bundled by mistake" }
          # Native DLLs ship below the program, in app/amd64 (never self-extracted into the user's %TEMP%).
          foreach ($d in 'publish/fd/app', 'publish/sc/app') {
            if (-not (Test-Path "$d/amd64/KernelTraceControl.dll")) { throw "$d/amd64/KernelTraceControl.dll missing: native DLLs are bundled for self-extraction again" }
          }
      - name: Publish the launcher (NativeAOT) into both builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The launcher, PoolWatch.exe above app\, starts every elevated PoolWatch with an environment it builds itself.
          # Compiled ahead of time, it loads no .NET runtime, so the variables that make one load code do nothing to it.
          # PublishAot is passed here, not set in the project: the native compiler packages come through PackageDownload,
          # which no lock file can pin, and the SDK's implicit ILLink package follows the SDK's patch, so this one restore
          # runs unlocked (the project has no package of its own; its normal build, for the tests, restores locked like
          # every other). LauncherLinkMap has the linker write its map, which the next step reads.
          dotnet publish src/PoolWatch.Launcher/PoolWatch.Launcher.csproj -c Release -r win-x64 -p:PublishAot=true -p:RestoreLockedMode=false "-p:LauncherLinkMap=$PWD/publish/launcher-link.map" -o publish/launcher
          if ($LASTEXITCODE -ne 0) { throw "launcher publish failed ($LASTEXITCODE)" }
          $exe = 'publish/launcher/PoolWatch.exe'
          # Native: a .NET publish would put PoolWatch.dll and its runtimeconfig.json next to it.
          $managed = @(Get-ChildItem publish/launcher -File | Where-Object { $_.Extension -in '.dll', '.json' })
          if ($managed.Count -gt 0) { throw "the launcher was not compiled to native code: $($managed.Name -join ', ')" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          # Its manifest (carried over from the project) asks for administrator rights, and it is a Windows program, not a
          # console one (the PE header's subsystem: 2).
          if ([Text.Encoding]::ASCII.GetString($bytes).IndexOf('level="requireAdministrator"') -lt 0) { throw 'the launcher has no manifest that asks for administrator rights' }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $optional = $pe + 24
          $subsystem = [BitConverter]::ToUInt16($bytes, $optional + 68)
          if ($subsystem -ne 2) { throw "the launcher's subsystem is $subsystem, not a Windows program (2)" }
          # The DLLs it imports are loaded from System32 only (/DEPENDENTLOADFLAG:0x800, LOAD_LIBRARY_SEARCH_SYSTEM32): the
          # load configuration's DependentLoadFlags (offset 78), found through data directory 10 (PE32+: directories from 112).
          $loadConfig = [BitConverter]::ToUInt32($bytes, $optional + 112 + 10 * 8)
          $at = -1
          $sections = $optional + [BitConverter]::ToUInt16($bytes, $pe + 20)
          for ($i = 0; $i -lt [BitConverter]::ToUInt16($bytes, $pe + 6); $i++) {
            $s = $sections + 40 * $i
            $va = [BitConverter]::ToUInt32($bytes, $s + 12)
            if ($loadConfig -ge $va -and $loadConfig -lt $va + [BitConverter]::ToUInt32($bytes, $s + 8)) { $at = [int]($loadConfig - $va + [BitConverter]::ToUInt32($bytes, $s + 20)) }
          }
          if ($loadConfig -eq 0 -or $at -lt 0 -or [BitConverter]::ToUInt32($bytes, $at) -lt 80) { throw 'the launcher has no load configuration that can hold its dependent load flags' }
          $flags = [BitConverter]::ToUInt16($bytes, $at + 78)
          if ($flags -ne 0x800) { throw ('the launcher''s dependent load flags are 0x{0:X}, not 0x800 (System32 only)' -f $flags) }
          # Its version info is the build's, as the program's (the sign job checks it against the tag).
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne (Get-Item publish/fd/app/PoolWatch.exe).VersionInfo.ProductVersion) { throw "the launcher's version is '$version', not PoolWatch's" }
          foreach ($d in 'publish/fd', 'publish/sc') { Copy-Item $exe $d }
          Get-Item $exe | Format-Table Name, Length
      - name: List the libraries the launcher's link used (THIRD-PARTY-NOTICES.md covers them)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The linker's map names, for every symbol it placed, where it came from: lib:object for an object taken from a
          # library (code compiled into the launcher), lib:name.dll for an import (code that stays in a Windows DLL). Each
          # library whose code the launcher carries must be one THIRD-PARTY-NOTICES.md covers: the .NET runtime's native
          # parts (from the NativeAOT compiler package), the Visual C++ runtime's static libraries, and the Windows SDK's
          # uuid.lib; anything else stops the build. The Universal C Runtime must be imported from Windows, never linked in,
          # and the Visual C++ runtime DLLs must not be imported (the launcher ships without them).
          $map = 'publish/launcher-link.map'
          if (-not (Test-Path -LiteralPath $map)) { throw 'the launcher''s link wrote no map' }
          $static = @{}; $imports = @{}
          # Only the symbol lines are read: the lines after the map's column header ("Address  Publics by Value  Rva+Base
          # Lib:Object") that start with a section:offset address (0001:00012345). The header itself, the timestamp and
          # load address lines, the section table above it, the entry point line and the "Static symbols" heading are not.
          # The last column of a symbol line is lib:object; a library's name has two characters at least, so a drive
          # letter in an object's path is never read as one.
          $symbols = $false
          foreach ($line in Get-Content -LiteralPath $map) {
            if (-not $symbols) { $symbols = $line -match '^\s*Address\s+Publics by Value\s'; continue }
            if ($line -match '^\s*[0-9A-Fa-f]{4}:[0-9A-Fa-f]{8}\s.*\s(?<lib>[A-Za-z][^\s:]+):(?<obj>\S+)\s*$') {
              # Both captures are taken before anything else is matched: a later -match sets $Matches anew.
              $lib = ($Matches.lib -replace '\.lib$', '').ToLowerInvariant(); $obj = $Matches.obj.ToLowerInvariant()
              if ($obj.EndsWith('.dll')) { $imports[$obj] = $true } else { $static[$lib] = $true }
            }
          }
          if (-not $symbols) { throw 'the launcher''s link map has no "Publics by Value" list: the map is not read as expected' }
          $dotnet = 'runtime.workstationgc', 'runtime.servergc', 'eventpipe-disabled', 'runtime.vxsortdisabled', 'runtime.vxsortenabled',
                    'standalonegc-disabled', 'aotminipal', 'zlibstatic', 'brotlicommon', 'brotlienc', 'brotlidec', 'bootstrapper',
                    'system.globalization.native.aot', 'system.io.compression.native.aot'
          $visualC = 'libcmt', 'libvcruntime', 'libcpmt', 'libconcrt', 'oldnames'
          $sdk = 'uuid'
          Write-Host "Linked in (static): $(($static.Keys | Sort-Object) -join ', ')"
          Write-Host "Visual C++ runtime libraries among them: $(($static.Keys | Where-Object { $_ -in $visualC } | Sort-Object) -join ', ')"
          Write-Host "Imported from Windows: $(($imports.Keys | Sort-Object) -join ', ')"
          $other = @($static.Keys | Where-Object { $_ -notin $dotnet -and $_ -notin $visualC -and $_ -notin $sdk })
          if ($other.Count -gt 0) { throw "the launcher's link used libraries THIRD-PARTY-NOTICES.md does not cover: $($other -join ', ')" }
          if ($static.ContainsKey('libucrt')) { throw 'the launcher links the Universal C Runtime in (libucrt.lib), not from Windows' }
          $vcDlls = @($imports.Keys | Where-Object { $_ -match '^(vcruntime|msvcp|concrt)\d' })
          if ($vcDlls.Count -gt 0) { throw "the launcher imports Visual C++ runtime DLLs it does not ship: $($vcDlls -join ', ')" }
          if (@($imports.Keys | Where-Object { $_ -match '^(api-ms-win-crt-|ucrtbase)' }).Count -eq 0) { throw 'the launcher imports no Universal C Runtime from Windows: the map is not read as expected' }
      - name: Add the .NET runtime's licences to both builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Both builds carry the launcher, which has the .NET runtime's native parts compiled in from the NativeAOT compiler
          # packages its publish used: those packages' own licence and notice files go into both builds (both zips and the
          # installer), in licenses\Microsoft.DotNet.ILCompiler\. The packages are resolved again for the launcher's own
          # properties, as its publish resolved them.
          $ilc = (dotnet msbuild src/PoolWatch.Launcher/PoolWatch.Launcher.csproj -t:ResolveFrameworkReferences -getItem:ResolvedILCompilerPack,ResolvedTargetILCompilerPack `
            -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -p:PublishAot=true -p:RestoreLockedMode=false | ConvertFrom-Json).Items
          $ilcDirs = @(@($ilc.ResolvedILCompilerPack) + @($ilc.ResolvedTargetILCompilerPack) | Where-Object { $_ -and $_.PackageDirectory -and (Test-Path -LiteralPath $_.PackageDirectory) } |
            ForEach-Object { $_.PackageDirectory } | Sort-Object -Unique)
          if ($ilcDirs.Count -eq 0) { throw 'the NativeAOT compiler packages the launcher was built with were not found' }
          $ilcFiles = @(foreach ($dir in $ilcDirs) { Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '^(LICENSE|THIRD-PARTY-NOTICES)(\.TXT)?$' } })
          foreach ($name in 'LICENSE', 'THIRD-PARTY-NOTICES') {
            if (-not ($ilcFiles | Where-Object BaseName -eq $name)) { throw "the NativeAOT compiler packages ($($ilcDirs -join ', ')) have no $name file" }
          }
          foreach ($d in 'publish/fd', 'publish/sc') {
            $to = New-Item -ItemType Directory -Force "$d/licenses/Microsoft.DotNet.ILCompiler"
            foreach ($f in $ilcFiles) { Copy-Item $f.FullName (Join-Path $to.FullName "$($f.BaseName).TXT") -Force }
          }
          Write-Host "NativeAOT compiler packages: $($ilcDirs -join ', '): $($ilcFiles.Name -join ', ')"
          # The self-contained build (its zip and the installer) carries the .NET and Windows Desktop runtimes: their
          # runtime packs' own licence and notice files go with it, in licenses\<runtime>\. The packs are the ones that
          # build used: the SDK resolves them again for the same properties (never the newest one in the package cache).
          $packs = (dotnet msbuild src/PoolWatch/PoolWatch.csproj -t:ResolveFrameworkReferences -getItem:ResolvedRuntimePack `
            -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -p:SelfContained=true | ConvertFrom-Json).Items.ResolvedRuntimePack
          foreach ($runtime in 'Microsoft.NETCore.App', 'Microsoft.WindowsDesktop.App') {
            $pack = @($packs | Where-Object FrameworkName -eq $runtime)[0]
            if (-not $pack -or -not (Test-Path -LiteralPath $pack.PackageDirectory)) { throw "the $runtime runtime pack the build used was not found" }
            $files = @(Get-ChildItem -LiteralPath $pack.PackageDirectory -File | Where-Object { $_.Name -match '^(LICENSE|THIRD-PARTY-NOTICES)(\.TXT)?$' })
            if ($files.Count -eq 0) { throw "the $runtime $($pack.NuGetPackageVersion) runtime pack has no licence file" }
            $to = New-Item -ItemType Directory -Force "publish/sc/licenses/$runtime"
            foreach ($f in $files) { Copy-Item $f.FullName (Join-Path $to.FullName "$($f.BaseName).TXT") }
            Write-Host "$runtime $($pack.NuGetPackageVersion): $($files.Name -join ', ')"
          }
      - name: Self-test (native collectors vs independent sources)
        shell: pwsh
        run: |
          . ./ci/common.ps1
          $p = Start-PoolWatch "$PWD/publish/fd/app/PoolWatch.exe" @('--selftest', '--out', "$env:RUNNER_TEMP/selftest")
          $code = Wait-PoolWatch $p 180
          Get-Content "$env:RUNNER_TEMP/selftest/selftest.json"
          if ($code -ne 0) { throw "selftest failed ($code)" }
      - name: Self-test (self-contained exe)
        shell: pwsh
        run: |
          . ./ci/common.ps1
          $p = Start-PoolWatch "$PWD/publish/sc/app/PoolWatch.exe" @('--selftest', '--out', "$env:RUNNER_TEMP/selftest-sc")
          $code = Wait-PoolWatch $p 180
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP/selftest-sc/selftest.json"; throw "self-contained selftest failed ($code)" }
      - name: Publish Leaker (test helper)
        run: dotnet publish tools/Leaker/Leaker.csproj -c Release -r win-x64 -p:SelfContained=false -o publish/leaker
      - name: M1 headless CSV checks
        shell: pwsh
        run: ./ci/m1-headless.ps1 -Exe "$PWD/publish/fd/app/PoolWatch.exe" -Out "$env:RUNNER_TEMP/m1"
      - name: Upload executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PoolWatch-exe
          # Each build is a folder, laid out as it is installed (the launcher, PoolWatch.exe, and PoolWatch itself with its
          # native DLLs in app\): install the whole folder.
          path: |
            publish/fd/
            publish/sc/
          if-no-files-found: error
      - name: Upload Leaker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leaker
          path: publish/leaker
          if-no-files-found: error
      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-output
          path: |
            ${{ runner.temp }}/selftest
            ${{ runner.temp }}/selftest-sc
            ${{ runner.temp }}/m1
          if-no-files-found: warn

  e2e:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [handles, files, orphan, capture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leaker
          path: publish/leaker
      - name: End-to-end scenario ${{ matrix.scenario }}
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: ./ci/m2-e2e.ps1 -Scenario $env:SCENARIO -Exe "$PWD/publish/fd/app/PoolWatch.exe" -Leaker "$PWD/publish/leaker/Leaker.exe" -Out "$env:RUNNER_TEMP/e2e-$env:SCENARIO"
      - name: Upload incidents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.scenario }}
          path: ${{ runner.temp }}/e2e-${{ matrix.scenario }}
          if-no-files-found: warn

  diag:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [spawn, clearcache, tokenguard, services, identity, tokens, filters, shape, lag, experiment, versions, accumulation, bundle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leaker
          path: publish/leaker
      - name: Diagnostics scenario ${{ matrix.scenario }}
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: ./ci/diag-e2e.ps1 -Scenario $env:SCENARIO -Exe "$PWD/publish/fd/app/PoolWatch.exe" -Leaker "$PWD/publish/leaker/Leaker.exe" -Out "$env:RUNNER_TEMP/diag-$env:SCENARIO"
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-${{ matrix.scenario }}
          path: ${{ runner.temp }}/diag-${{ matrix.scenario }}
          if-no-files-found: warn

  ui:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leaker
          path: publish/leaker
      # Each script whose checks the tests pin saves its output, and the next step fails the job when the output lacks a
      # CHECK-RAN line that ci/expected-checks.txt lists for it, or the line Complete-Assertions prints when no check failed
      # (the soak's other leg, which runs none of its pinned checks, has a step that looks for that line alone).
      # CheckMarkerTests holds every such step to this pattern, and its job to no condition but the soak's own.
      - name: UI smoke test + screenshots
        shell: pwsh
        run: ./ci/m4-ui.ps1 -Exe "$PWD/publish/fd/app/PoolWatch.exe" -Leaker "$PWD/publish/leaker/Leaker.exe" -Out "$env:RUNNER_TEMP/ui" 6>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/m4-ui.ps1.out"
      - name: Check that m4-ui.ps1 ran each check that ci/expected-checks.txt lists for it
        shell: pwsh
        env:
          CI_SCRIPT: m4-ui.ps1
        run: |
          $ran = @(Get-Content -LiteralPath "$env:RUNNER_TEMP/$env:CI_SCRIPT.out" | ForEach-Object { "$_".Trim() })
          $expected = @(Get-Content -LiteralPath ci/expected-checks.txt | ForEach-Object { if ($_ -match "^$([regex]::Escape($env:CI_SCRIPT)) (\S+)\s*$") { $Matches[1] } })
          if ($expected.Count -eq 0) { throw "ci/expected-checks.txt lists no check for $env:CI_SCRIPT" }
          $missing = @($expected | Where-Object { "CHECK-RAN: $_" -notin $ran })
          if ($missing.Count -gt 0) { throw "$env:CI_SCRIPT did not run these checks: $($missing -join ', ')" }
          if (@($ran -match ' : all assertions passed$').Count -eq 0) { throw "$env:CI_SCRIPT ended before Complete-Assertions said that no check failed" }
          Write-Host "$env:CI_SCRIPT ran each of the $($expected.Count) checks that ci/expected-checks.txt lists for it"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui
          if-no-files-found: warn

  # The installer, unsigned (the sign job builds the signed one from the same script): a silent install, a real change,
  # a silent uninstall while PoolWatch runs, and the same with /KEEPCHANGES (ci/installer-e2e.ps1).
  installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Publish "$PWD\publish\sc" -Out "$env:RUNNER_TEMP\setup"
      - name: Install, change, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\setup" -Filter 'PoolWatch-v*-setup-win-x64.exe' | Select-Object -First 1
          ./ci/installer-e2e.ps1 -Setup $setup.FullName -Out "$env:RUNNER_TEMP\installer-e2e" 6>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/installer-e2e.ps1.out"
      - name: Check that installer-e2e.ps1 ran each check that ci/expected-checks.txt lists for it
        shell: pwsh
        env:
          CI_SCRIPT: installer-e2e.ps1
        run: |
          $ran = @(Get-Content -LiteralPath "$env:RUNNER_TEMP/$env:CI_SCRIPT.out" | ForEach-Object { "$_".Trim() })
          $expected = @(Get-Content -LiteralPath ci/expected-checks.txt | ForEach-Object { if ($_ -match "^$([regex]::Escape($env:CI_SCRIPT)) (\S+)\s*$") { $Matches[1] } })
          if ($expected.Count -eq 0) { throw "ci/expected-checks.txt lists no check for $env:CI_SCRIPT" }
          $missing = @($expected | Where-Object { "CHECK-RAN: $_" -notin $ran })
          if ($missing.Count -gt 0) { throw "$env:CI_SCRIPT did not run these checks: $($missing -join ', ')" }
          if (@($ran -match ' : all assertions passed$').Count -eq 0) { throw "$env:CI_SCRIPT ended before Complete-Assertions said that no check failed" }
          Write-Host "$env:CI_SCRIPT ran each of the $($expected.Count) checks that ci/expected-checks.txt lists for it"
      - name: Upload the setup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/setup/*.exe
          if-no-files-found: warn
      # The test's output folder on its own, pass or fail: each setup's and uninstall's log (/LOG), PoolWatch's output,
      # and when a setup failed or an uninstall left the install folder, what was left in it, what ran from it
      # (<step>-left.txt) and PoolWatch's own log at that point.
      - name: Upload the installer test's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-e2e
          path: ${{ runner.temp }}/installer-e2e
          if-no-files-found: warn

  linux-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/PoolWatch.Tests -c Release
      # A compile check of the Windows app. Its restore cannot use the lock file, which is made on Windows: the Linux SDK
      # has no Windows Desktop targeting pack, so restore cannot prune System.CodeDom (a System.Management dependency that
      # Windows Desktop provides), and the graph differs by that one package. An existing lock file is reused even without
      # locked mode, so --force-evaluate re-resolves from the project files. Safe: nothing built here is shipped or run,
      # and the job holds no secrets. The unit tests above stay locked.
      - run: dotnet restore src/PoolWatch/PoolWatch.csproj --force-evaluate -p:RestoreLockedMode=false
      - run: dotnet build src/PoolWatch/PoolWatch.csproj -c Release --no-restore

  # Windows on Arm, on GitHub's Windows 11 Arm runners. There is no Arm64 build: Windows on Arm runs the x64 build through
  # its built-in x64 emulation. PoolWatch.Tests run natively on Arm64; PoolWatch.AppTests build the app for x64, as it
  # ships, so they run on the x64 .NET under emulation.
  arm64-unit-tests:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The x64 .NET goes to %ProgramFiles%\dotnet\x64, where Windows on Arm keeps it. The Arm64 .NET is set up second, so
      # it comes first on PATH and in DOTNET_ROOT: `dotnet` is the native one.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          architecture: x64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests (Arm64)
        run: dotnet test tests/PoolWatch.Tests -c Release --logger "console;verbosity=normal"
      - name: App-layer unit tests (x64 under emulation)
        shell: pwsh
        run: |
          # DOTNET_ROOT names the Arm64 .NET: the x64 test host finds its own through DOTNET_ROOT_X64.
          $env:DOTNET_ROOT_X64 = "$env:ProgramFiles\dotnet\x64"
          & "$env:DOTNET_ROOT_X64\dotnet.exe" test tests/PoolWatch.AppTests -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "app-layer unit tests failed ($LASTEXITCODE)" }

  # What Windows on Arm users run: the self-contained x64 build from the build job, laid out as the setup installs it,
  # under emulation: the build job's self-test and headless checks, then every e2e and diag scenario, each on a runner of
  # its own.
  arm64:
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # In the build, e2e and diag jobs' order: keep this list in step with theirs.
        check: [selftest, headless, e2e-handles, e2e-files, e2e-orphan, e2e-capture,
                diag-spawn, diag-clearcache, diag-tokenguard, diag-services, diag-identity, diag-tokens, diag-filters,
                diag-shape, diag-lag, diag-experiment, diag-versions, diag-accumulation, diag-bundle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Leaker, the test helper, is a framework-dependent x64 build: it runs on the x64 .NET.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leaker
          path: publish/leaker
      - name: Lay out the self-contained build as the setup does (exe names and folders)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The build is laid out as the setup installs it: the launcher as PoolWatch.exe, PoolWatch itself as
          # app\PoolWatch.exe with its folders. The checks start PoolWatch itself (with --allow-any-location).
          $app = "$env:RUNNER_TEMP\PoolWatch"
          New-Item -ItemType Directory $app | Out-Null
          Copy-Item publish/sc/* $app -Recurse
          # Stop unless this is the x64 build on Arm64 Windows: emulation is what this job tests.
          foreach ($exe in "$app\app\PoolWatch.exe", "$app\PoolWatch.exe") {
            $fs = [IO.File]::OpenRead($exe)
            try { $h = [byte[]]::new(4096); [void]$fs.Read($h, 0, $h.Length) } finally { $fs.Dispose() }
            $machine = [BitConverter]::ToUInt16($h, [BitConverter]::ToInt32($h, 0x3C) + 4)
            $os = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
            if ($machine -ne 0x8664 -or $os -ne 'Arm64') { throw "expected the x64 build on Arm64 Windows: $exe is machine 0x$($machine.ToString('X4')) on $os" }
          }
          "POOLWATCH=$app\app\PoolWatch.exe" >> $env:GITHUB_ENV
      - name: ${{ matrix.check }} (x64 build under emulation)
        shell: pwsh
        env:
          CHECK: ${{ matrix.check }}
        run: |
          $out = "$env:RUNNER_TEMP\$env:CHECK"
          $leaker = "$PWD\publish\leaker\Leaker.exe"
          $kind, $scenario = $env:CHECK -split '-', 2
          switch ($kind) {
            'selftest' {
              . ./ci/common.ps1
              $p = Start-PoolWatch $env:POOLWATCH @('--selftest', '--out', $out)
              $code = Wait-PoolWatch $p 180
              Get-Content "$out\selftest.json"
              if ($code -ne 0) { throw "selftest failed ($code)" }
            }
            'headless' { ./ci/m1-headless.ps1 -Exe $env:POOLWATCH -Out $out }
            'e2e' { ./ci/m2-e2e.ps1 -Scenario $scenario -Exe $env:POOLWATCH -Leaker $leaker -Out $out }
            'diag' { ./ci/diag-e2e.ps1 -Scenario $scenario -Exe $env:POOLWATCH -Leaker $leaker -Out $out }
            default { throw "unknown check '$env:CHECK'" }
          }
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-${{ matrix.check }}
          path: ${{ runner.temp }}/${{ matrix.check }}
          if-no-files-found: warn

  # The long checks: on demand and on a release tag (where the release needs them).
  overhead:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/PoolWatch/PoolWatch.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -o publish/fd/app
      - name: Overhead check (10 min idle, default interval)
        shell: pwsh
        run: ./ci/overhead.ps1 -Exe "$PWD/publish/fd/app/PoolWatch.exe" -Out "$env:RUNNER_TEMP/overhead"
      - name: Upload overhead output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overhead-output
          path: ${{ runner.temp }}/overhead
          if-no-files-found: warn

  soak:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    # 45 minutes of soak (ci/soak.ps1), up to 3 more for PoolWatch to exit, plus checkout, .NET setup and downloads.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leaker
          path: publish/leaker
      - name: Soak under a busy-PC load (${{ matrix.mode }})
        shell: pwsh
        env:
          SOAK_MODE: ${{ matrix.mode }}
        run: ./ci/soak.ps1 -Exe "$PWD/publish/fd/app/PoolWatch.exe" -Leaker "$PWD/publish/leaker/Leaker.exe" -Out "$env:RUNNER_TEMP/soak" -Ui:($env:SOAK_MODE -eq 'ui') -Assert 6>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/soak.ps1.out"
      # The soak's pinned checks are its -Ui ones, so only the ui leg prints their markers.
      - name: Check that soak.ps1 ran each check that ci/expected-checks.txt lists for it
        if: matrix.mode == 'ui'
        shell: pwsh
        env:
          CI_SCRIPT: soak.ps1
        run: |
          $ran = @(Get-Content -LiteralPath "$env:RUNNER_TEMP/$env:CI_SCRIPT.out" | ForEach-Object { "$_".Trim() })
          $expected = @(Get-Content -LiteralPath ci/expected-checks.txt | ForEach-Object { if ($_ -match "^$([regex]::Escape($env:CI_SCRIPT)) (\S+)\s*$") { $Matches[1] } })
          if ($expected.Count -eq 0) { throw "ci/expected-checks.txt lists no check for $env:CI_SCRIPT" }
          $missing = @($expected | Where-Object { "CHECK-RAN: $_" -notin $ran })
          if ($missing.Count -gt 0) { throw "$env:CI_SCRIPT did not run these checks: $($missing -join ', ')" }
          if (@($ran -match ' : all assertions passed$').Count -eq 0) { throw "$env:CI_SCRIPT ended before Complete-Assertions said that no check failed" }
          Write-Host "$env:CI_SCRIPT ran each of the $($expected.Count) checks that ci/expected-checks.txt lists for it"
      # The headless leg runs none of the pinned checks, so it prints no marker: on that leg only the line that
      # Complete-Assertions prints when no check failed is looked for.
      - name: Check that soak.ps1 said that no check failed
        if: matrix.mode != 'ui'
        shell: pwsh
        env:
          CI_SCRIPT: soak.ps1
        run: |
          $ran = @(Get-Content -LiteralPath "$env:RUNNER_TEMP/$env:CI_SCRIPT.out" | ForEach-Object { "$_".Trim() })
          if (@($ran -match ' : all assertions passed$').Count -eq 0) { throw "$env:CI_SCRIPT ended before Complete-Assertions said that no check failed" }
          Write-Host "$env:CI_SCRIPT said that no check failed"
      - name: Upload soak output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/soak/soak.*
            ${{ runner.temp }}/soak/profile.json
            ${{ runner.temp }}/soak/overhead.json
            ${{ runner.temp }}/soak/summary.json
            ${{ runner.temp }}/soak/poolwatch.log
            ${{ runner.temp }}/soak/screenshots
          if-no-files-found: warn

  # ------------------------------------------------------------------------------------------------------------------
  # Release, part 1: sign and verify (a v* tag only). This job holds the signing secrets, from the "release" environment
  # (a deployment rule lets only v* tags use it), and only a read-only token. It fails closed: any file that should be
  # signed and is not, or is signed by anyone else, or has no RFC 3161 timestamp, stops the release.
  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e, diag, ui, installer, overhead, soak, linux-unit-tests, arm64-unit-tests, arm64]
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30   # a hung silent installer must not hold the runner (and the signing session) for the 6 h default
    permissions:
      contents: read
    env:
      # The code-signing certificate's leaf (SSL.com eSigner, "Nicholas Moger"). It EXPIRES 2027-08-10: renew the
      # certificate before then and put the new leaf's thumbprint here. Files signed before that keep verifying (they
      # carry an RFC 3161 timestamp).
      EXPECTED_THUMBPRINT: 00EC0DEE208F91785D253C0731E28249C68053FD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PoolWatch-exe
          path: publish

      - name: Check the tag and the version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' is not v<major>.<minor>.<patch>[-suffix]" }
          $version = $Matches[1]
          # Each build's two programs: the launcher (PoolWatch.exe) and PoolWatch itself (app\PoolWatch.exe).
          foreach ($exe in 'publish/fd/PoolWatch.exe', 'publish/fd/app/PoolWatch.exe', 'publish/sc/PoolWatch.exe', 'publish/sc/app/PoolWatch.exe') {
            $product = ((Get-Item $exe).VersionInfo.ProductVersion -split '\+')[0]
            if ($product -ne $version) { throw "$exe is version '$product' but the tag is ${tag}: set <Version> in Directory.Build.props before tagging" }
          }

      # SSL.com eSigner CKA (cloud HSM), the same setup as the maintainer's other signed project: the key never exists as
      # a file on the runner; CKA registers a key storage provider so the certificate appears in the user's store.
      - name: Set up code signing (eSigner CKA)
        id: esigner
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ES_USERNAME -or -not $env:ES_PASSWORD -or -not $env:ES_TOTP_SECRET) {
            throw 'Signing secrets are missing from the "release" environment: refusing to release unsigned files'
          }
          # Pinned release + SHA-256 of the installer, verified before running.
          $url = 'https://github.com/SSLcom/eSignerCKA/releases/download/v1.1.2/SSL.COM.eSigner.CKA_1.1.2_build_202600624.exe'
          $sha = '3F088403139505DDFB0ED3B56B72893F92C865F98B382753A1E1C695A5CECE35'
          $setup = Join-Path $env:RUNNER_TEMP 'eSignerCKA-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "eSigner CKA download hash mismatch: got $actual" }
          $dir = Join-Path $env:RUNNER_TEMP 'eSignerCKA'
          Start-Process $setup -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=$dir" -Wait
          # SSL.com's CKA sequence: install -> vc_redist.x64 -> RegisterKSP -> eSignerCSP.Config -> config / unload / load.
          # The x64 eSigner KSP needs the x64 VC++ runtime; the CKA installer bundles only the x86 one.
          $vcx64 = Join-Path $dir 'vc_redist.x64.exe'
          if (-not (Test-Path $vcx64)) { Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $vcx64 }
          $vs = Get-AuthenticodeSignature $vcx64
          if ($vs.Status -ne 'Valid' -or $vs.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') { throw "vc_redist.x64.exe is not validly signed by Microsoft ($($vs.Status))" }
          Start-Process $vcx64 -ArgumentList '/install','/quiet','/norestart' -Wait
          $registerKsp = Join-Path $dir 'RegisterKSP.exe'
          if (Test-Path $registerKsp) { & $registerKsp 2>&1 | Out-Null; Write-Host "RegisterKSP exit: $LASTEXITCODE" }
          $cspConfig = Join-Path $dir 'eSignerCSP.Config.exe'
          if (Test-Path $cspConfig) { & $cspConfig 2>&1 | Out-Null; Write-Host "eSignerCSP.Config exit: $LASTEXITCODE" }
          $tool = @('eSignerCKATool.exe', 'eSignerCKA.exe') | ForEach-Object { Join-Path $dir $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tool) { throw "eSigner CKA CLI not found in $dir" }
          & $tool config -mode product -user $env:ES_USERNAME -pass $env:ES_PASSWORD -totp $env:ES_TOTP_SECRET -key (Join-Path $dir 'master.key') -r
          & $tool unload
          & $tool load
          # The thumbprint is read from the store, and only the expected leaf is accepted (never a subject match).
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Where-Object { $_.Thumbprint -eq $env:EXPECTED_THUMBPRINT } | Select-Object -First 1
          if (-not $cert) {
            Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | ForEach-Object { Write-Host "loaded: $($_.Subject) [$($_.Thumbprint)] until $($_.NotAfter)" }
            throw "eSigner CKA did not load the expected certificate $env:EXPECTED_THUMBPRINT (renewed? update EXPECTED_THUMBPRINT)"
          }
          Write-Host "Certificate loaded: $($cert.Subject) [$($cert.Thumbprint)], valid until $($cert.NotAfter)"
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Sign every PoolWatch file that Microsoft has not signed
        shell: pwsh
        env:
          SIGN_THUMBPRINT: ${{ steps.esigner.outputs.thumbprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGN_THUMBPRINT -ne $env:EXPECTED_THUMBPRINT) { throw "Captured thumbprint '$env:SIGN_THUMBPRINT' is not the expected one" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe (Windows SDK) not found on the runner' }
          Write-Host "signtool: $($signtool.FullName)"
          $signed = 0
          # Every PE file (it starts with "MZ"), whatever its extension: a PE added later under another name or none must not
          # ship unsigned or unverified.
          function Test-Pe([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try { $h = [byte[]]::new(2); ($fs.Read($h, 0, 2) -eq 2) -and $h[0] -eq 0x4D -and $h[1] -eq 0x5A } finally { $fs.Dispose() }
          }
          $pe = @(Get-ChildItem publish/fd, publish/sc -Recurse -File | Where-Object { Test-Pe $_.FullName })
          foreach ($f in $pe) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -eq 'Valid' -and $s.SignerCertificate.Subject -match '(^|, )O=Microsoft Corporation(,|$)') {
              Write-Host "Microsoft-signed, left as it is: $($f.FullName)"
              continue
            }
            & $signtool.FullName sign /fd sha256 /tr http://ts.ssl.com /td sha256 /sha1 $env:SIGN_THUMBPRINT $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($f.FullName) (exit $LASTEXITCODE)" }
            $signed++
          }
          if ($signed -lt 4) { throw "Only $signed file(s) were signed: expected at least the launcher and PoolWatch itself in each build" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # From the signed self-contained build: the Codex shortcut's launcher script is signed before it is packed, and Inno
      # Setup signs the setup and its uninstaller with the same certificate as it makes them.
      - name: Build the signed installer
        shell: pwsh
        env:
          SIGN_THUMBPRINT: ${{ steps.esigner.outputs.thumbprint }}
        run: ./installer/build.ps1 -Publish "$PWD\publish\sc" -Out "$PWD\setup" -SignTool $env:SIGNTOOL -Thumbprint $env:SIGN_THUMBPRINT

      - name: Verify every signature (Valid, the expected signer, an RFC 3161 timestamp)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Security.Cryptography.Pkcs
          # True when the file's Authenticode signature carries an RFC 3161 timestamp (counter-signature attribute
          # 1.3.6.1.4.1.311.3.3.1). Read from the PE certificate table; nothing is executed.
          function Test-Rfc3161([string]$Path) {
            $b = [IO.File]::ReadAllBytes($Path)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([BitConverter]::ToUInt32($b, $pe) -ne 0x4550) { return $false }
            $opt = $pe + 24
            $dirs = $opt + $(if ([BitConverter]::ToUInt16($b, $opt) -eq 0x20B) { 112 } else { 96 })
            $off = [BitConverter]::ToInt32($b, $dirs + 32)   # IMAGE_DIRECTORY_ENTRY_SECURITY (4): a file offset
            if ($off -le 0 -or [BitConverter]::ToInt32($b, $dirs + 36) -le 8) { return $false }
            $p = $off + 8                                    # past WIN_CERTIFICATE's header: the PKCS#7 SignedData
            if ($b[$p] -ne 0x30) { return $false }
            $l = [int]$b[$p + 1]; $n = 0; $h = 2
            if ($l -lt 0x80) { $n = $l } else { $k = $l -band 0x7F; for ($i = 0; $i -lt $k; $i++) { $n = ($n -shl 8) -bor $b[$p + 2 + $i] }; $h = 2 + $k }
            $der = [byte[]]::new($h + $n); [Array]::Copy($b, $p, $der, 0, $h + $n)
            $cms = [System.Security.Cryptography.Pkcs.SignedCms]::new(); $cms.Decode($der)
            foreach ($si in $cms.SignerInfos) { foreach ($a in $si.UnsignedAttributes) { if ($a.Oid.Value -eq '1.3.6.1.4.1.311.3.3.1') { return $true } } }
            return $false
          }
          $bad = @()
          # Every PE file (it starts with "MZ"), whatever its extension: a PE added later under another name or none must not
          # ship unsigned or unverified.
          function Test-Pe([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try { $h = [byte[]]::new(2); ($fs.Read($h, 0, 2) -eq 2) -and $h[0] -eq 0x4D -and $h[1] -eq 0x5A } finally { $fs.Dispose() }
          }
          # The setup folder: the setup itself and the staged copy of the build it packed.
          $pe = @(Get-ChildItem publish/fd, publish/sc, setup -Recurse -File | Where-Object { Test-Pe $_.FullName })
          foreach ($f in $pe) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid') { $bad += "$($f.FullName): signature $($s.Status) ($($s.StatusMessage))"; continue }
            if ($s.SignerCertificate.Subject -match '(^|, )O=Microsoft Corporation(,|$)') { Write-Host "OK (Microsoft): $($f.FullName)"; continue }
            if ($s.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) { $bad += "$($f.FullName): signed by $($s.SignerCertificate.Subject) [$($s.SignerCertificate.Thumbprint)], not the expected leaf"; continue }
            if (-not $s.TimeStamperCertificate -or -not (Test-Rfc3161 $f.FullName)) { $bad += "$($f.FullName): no RFC 3161 timestamp"; continue }
            Write-Host "OK (signed): $($f.FullName)  timestamp: $($s.TimeStamperCertificate.Subject)"
          }
          foreach ($exe in 'publish/fd/PoolWatch.exe', 'publish/fd/app/PoolWatch.exe', 'publish/sc/PoolWatch.exe', 'publish/sc/app/PoolWatch.exe',
                           'setup/stage/PoolWatch.exe', 'setup/stage/app/PoolWatch.exe', "setup/PoolWatch-$env:GITHUB_REF_NAME-setup-win-x64.exe") {
            if (-not (Test-Path -LiteralPath $exe) -or (Get-AuthenticodeSignature -LiteralPath $exe).SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) { $bad += "${exe}: missing or not signed with the expected certificate" }
          }
          # The ChatGPT launcher script the setup installs (no RFC 3161 check: the signature itself is what PowerShell reads).
          $script = Get-AuthenticodeSignature -LiteralPath setup/stage/chatgpt-no-shader-cache.ps1
          if ($script.Status -ne 'Valid' -or $script.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
            $bad += "chatgpt-no-shader-cache.ps1: signature $($script.Status), signed by $($script.SignerCertificate.Subject)"
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "::error::$_" }; throw "$($bad.Count) file(s) failed verification: nothing is released" }

      - name: Zip each build, add the setup and write SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force release | Out-Null
          # Each zip carries the launcher under both names the program had in an install folder before 1.0, PoolWatch.exe
          # (the framework-dependent zip's) and PoolWatch-selfcontained.exe (the self-contained zip's), so a logon task or a
          # shortcut that an older copy of either zip made starts the launcher once either zip is unpacked over it, and no
          # older program is left under a launcher's name. (The setup, built from this folder above, installs it as
          # PoolWatch.exe, and as PoolWatch-selfcontained.exe where a file of that name is there already.) The copy is the
          # same signed file.
          foreach ($d in 'publish/fd', 'publish/sc') {
            Copy-Item "$d/PoolWatch.exe" "$d/PoolWatch-selfcontained.exe"
            if ((Get-FileHash "$d/PoolWatch.exe").Hash -ne (Get-FileHash "$d/PoolWatch-selfcontained.exe").Hash) { throw "$d/PoolWatch-selfcontained.exe is not the launcher" }
          }
          foreach ($pair in @(@('fd', "PoolWatch-$tag-win-x64.zip"), @('sc', "PoolWatch-$tag-win-x64-selfcontained.zip"))) {
            Copy-Item LICENSE, THIRD-PARTY-NOTICES.md "publish/$($pair[0])/"
            Compress-Archive -Path "publish/$($pair[0])/*" -DestinationPath "release/$($pair[1])" -CompressionLevel Optimal
          }
          Copy-Item -LiteralPath "setup/PoolWatch-$tag-setup-win-x64.exe" release/
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content release/SHA256SUMS.txt

      - name: Upload the signed release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: release/
          if-no-files-found: error

      - name: Unload the signing certificate
        if: always()
        shell: pwsh
        run: |
          # Housekeeping on an ephemeral runner: never the reason a verified release is not published.
          $dir = Join-Path $env:RUNNER_TEMP 'eSignerCKA'
          $tool = @('eSignerCKATool.exe', 'eSignerCKA.exe') | ForEach-Object { Join-Path $dir $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          try { if ($tool) { & $tool unload } } catch { Write-Host "unload: $_" }
          $key = Join-Path $dir 'master.key'
          try { if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force } } catch { Write-Host "master.key: $_" }
          exit 0

  # Release, part 2: publish (a v* tag only). This job holds the write token and no signing secret; it publishes only
  # the files the sign job verified, after checking them against their checksums.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          files="PoolWatch-$GITHUB_REF_NAME-setup-win-x64.exe PoolWatch-$GITHUB_REF_NAME-win-x64.zip PoolWatch-$GITHUB_REF_NAME-win-x64-selfcontained.zip SHA256SUMS.txt"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac   # v1.2.0-rc.1 and the like
          # A re-run for a tag that already has a release replaces its files.
          gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "PoolWatch $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease \
            || gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
