name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, token permissions, branch rules,
# code review and more) on the default branch, publishes the score for the README badge and uploads the findings to
# code scanning. The Scorecard API accepts published results only from a narrow workflow (ossf/scorecard-action,
# "Workflow Restrictions"): no workflow-level env, defaults or write permissions, and only actions from its short
# approved list in this job.
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'   # weekly, so the score stays current between releases

permissions:
  contents: read

jobs:
  analysis:
    # A fork cannot publish to the Scorecard API.
    if: github.repository == 'nubbymong/poolwatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the findings to code scanning
      id-token: write          # prove to the Scorecard API that this workflow produced the results it publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
